  # debug mode
  debug: True
  seed: 42

  # # layer names to wrap
  # layer_classes: List[str] = field(
  #   default_factory=lambda: ["TransformerBlock"])

  # activation / gradient checkpointing & offloading
  enabled_act_ckpt: True
  enabled_act_offload: False

  # parameter offloading
  enabled_param_offload: False

  # mixed precision
  param_dtype: "bfloat16"
  reduce_dtype: "bfloat16"
  buffer_dtype: "bfloat16"
  low_precision_grad: True

  # sharding
  sharding_policy: "optimizer"

  # distributed training
  enabled_fsdp: True
  enabled_ddp: False

  # checkpointing
  save_interval: 128

  # save path
  save_path: null

  # logging
  log_interval: 32
  save_per_token_loss: False

  # evaluation
  eval_interval: 64

  # checkpointing
  ckpt_dir: "/mnt/raid0/checkpoints"
  base_cache_path: "/mnt/raid0/datasets/tmp_cache"

  # wandb
  wandb: False
  wandb_key: REMOVED # REMOVED # ted
  wandb_experiment_name: "bigmix_ft_fim_rev"

  # scaler
  scaler_init_scale: 65536 # 2 ** 16  
  scaler_backoff_factor: 0.5
  scaler_growth_factor: 2.0
  scaler_growth_interval: 2000

  # gradient clipping & optimization
  num_training_tokens: 96_000_000
  num_skip_tokens: 0
  ref_batch_size: 4
  gpu_batch_size: 1 
  clip_grad_norm: 1.0
  warm_up: 0.1

  # loss protection policy
  skip_malformed_batches: True
  malformed_batch_ppl_threshold: 32.0

  soften_loss_spikes: True
  apply_per_token_softening: False
  loss_spike_threshold: 1.5
  loss_spike_factor: 0.7

  min_loss_per_token: 0
  max_loss_per_token: 0

  malformed_batch_loss_threshold: 5
  

  # resume checkpoint
  resume_ckpt: null # /mnt/raid0/checkpoints/bigmix_ft_w0avann5/002816
  resume_training: False

