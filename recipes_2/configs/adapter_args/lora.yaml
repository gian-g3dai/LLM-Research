# lora config
policies:
  lora:
    config:
      rank:      1024
      dropout:   0.25
      alpha:      18
    module_filter:
      layer_classes: ["Linear"]
      layer_names:   ["w1", "w2", "w3", "wq", "wk", "wo", "wv"]
        # min_param_size:
  norm_unfreeze:
    config:
      empty: True
    module_filter:
      layer_classes: ["RMSNorm"]
      layer_names: ["norm"]

